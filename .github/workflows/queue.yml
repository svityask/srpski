# Продление очереди постов: раз в неделю проверяет ближайшие 3 недели и, если в каком-то дне нет
# «слова дня» (10:00) или вечернего поста (18:00), создаёт недостающие — только новые, без повторов.
name: queue
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check queue length
        id: check
        run: |
          holes=$(node -e "
            const p=require('./promo/daily/plan.json').items; let n=0;
            for(let i=1;i<=21;i++){const d=new Date(Date.now()+i*864e5).toISOString().slice(0,10);const day=p.filter(x=>x.date===d);
              if(!day.some(x=>x.type==='word'))n++; if(!day.some(x=>x.type==='lesson'||x.type==='quiz'))n++;}
            console.log(n)")
          echo "Пустых слотов в ближайшие 3 недели: $holes"
          if [ "$holes" -gt 0 ]; then echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright
        if: steps.check.outputs.run
        run: |
          npm i --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji
      - name: Fill empty slots
        if: steps.check.outputs.run
        env:
          PLAYWRIGHT: /tmp/pw/node_modules/playwright
        run: |
          node promo/tools/daily.js --days 21 | tee /tmp/daily.log
          if grep -q 'закончился' /tmp/daily.log; then echo "::warning::Новый контент для постов заканчивается — нужны новые уроки/слова (повторов не будет)"; fi
      - name: Save queue
        if: steps.check.outputs.run
        run: |
          git add promo/daily
          git diff --cached --quiet && exit 0
          git config user.name "srpski-bot"
          git config user.email "srpski-bot@users.noreply.github.com"
          git commit -q -m "Queue: new posts for empty slots"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1

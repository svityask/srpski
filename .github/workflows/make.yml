# Служебное: настройка сценария Make через API (promo/tools/make_api.js). Секрет MAKE_API_TOKEN, переменная MAKE_ZONE.
name: make
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'inspect | reels <scenarioId>'
        default: 'inspect'
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ZONE: ${{ vars.MAKE_ZONE || 'eu1' }}
          CMD: ${{ inputs.cmd }}
        run: node promo/tools/make_api.js $CMD

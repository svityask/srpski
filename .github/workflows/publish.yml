# Автопубликация постов @srpski_coach в Telegram и Instagram — бесплатно, без Zapier.
# Каждые 15 минут (GitHub часто пропускает запуски по расписанию) проверяет очередь promo/daily/plan.json (время в ней — белградское) и публикует пост, чьё время наступило.
# Секреты: TELEGRAM_BOT_TOKEN, IG_ACCESS_TOKEN (необязательно).
name: publish
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish — опубликовать ближайший пост сейчас; auto — как по расписанию (так запускает будильник Cloudflare); make-test — только отправить пример в Make; make-last — переотправить в Make последний опубликованный пост; make-ref — отправить в Make пост из поля ref; make-test-reel — пример ролика для настройки ветки Reels в Make'
        default: publish
        type: choice
        options: [publish, auto, make-test, make-last, make-ref, make-test-reel]
      ref:
        description: 'для make-ref: ref поста (например 5.1|porodica) или номер слова дня (5); можно несколько через запятую: 6,7,8'
        default: ''
  # обновил очередь — сразу проверить, нет ли поста к публикации (коммиты самого бота задание не запускают)
  push:
    branches: [main]
    paths: ['promo/daily/plan.json']
permissions:
  contents: write
concurrency:
  group: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish due post
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAKE_HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_REELS: ${{ vars.MAKE_REELS }}
          MODE: ${{ inputs.mode }}
          REF: ${{ inputs.ref }}
        run: node promo/tools/publish.js
      - name: Save queue
        if: always()
        run: |
          git diff --quiet promo/daily/plan.json && exit 0
          git config user.name "srpski-bot"
          git config user.email "srpski-bot@users.noreply.github.com"
          git add promo/daily/plan.json
          git commit -m "Publish: update queue"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Golos+Text:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}
#t{position:absolute;left:0;right:0;top:300px;text-align:center;color:#f3ead8;font:800 128px/1 Unbounded;letter-spacing:-.02em;text-shadow:0 6px 30px #000;opacity:0}
#t small{display:block;font:700 40px Golos Text;margin-top:22px;color:#e8b13a;letter-spacing:.08em}
#bub{position:absolute;left:90px;right:150px;top:140px;background:#fff;border:7px solid #14110f;border-radius:44px;padding:34px 40px;font:800 66px/1.1 Unbounded;color:#14110f;opacity:0;transform-origin:30% 100%}
#bub:after{content:"";position:absolute;left:330px;bottom:-62px;border:34px solid transparent;border-top:44px solid #14110f}
#bub i{display:block;font:500 34px Golos Text;font-style:normal;color:#a3262f;margin-top:14px}
#sign{position:absolute;left:50%;top:520px;transform:translateX(-50%);background:#1c3f8c;color:#fff;border:8px solid #fff;outline:6px solid #1c3f8c;border-radius:18px;padding:14px 50px;font:800 84px Unbounded;opacity:0}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="t">POLAKO<small>СЕРИЯ 1 · DOBRO DOŠLI</small></div>
<div id="sign">BEOGRAD</div>
<div id="bub">Dobar dan! Dobro došli u Srbiju!<i>[добар дан! добро дошли у Србию!] — Добрый день! Добро пожаловать в Сербию!</i></div>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, mix=(a,b,t)=>a+(b-a)*t;
let P1,P2,P3,MAP,MD,MW,MH,CH; const stars=[...Array(500)].map((_,i)=>[Math.random()*W,Math.random()*H,Math.random()*1.8+.3,Math.random()]);
const clouds=[...Array(46)].map(()=>[Math.random()*1.6-.3,Math.random(),Math.random()*.6+.4]);
window.ready=(async()=>{await document.fonts.ready;MAP=await ld('map.jpg');CH=await ld('chars.jpg');P1=await ld('p1.jpg');P2=await ld('p2.jpg');P3=await ld('p3.jpg');
 const k=document.createElement('canvas');MW=k.width=MAP.width;MH=k.height=MAP.height;const g=k.getContext('2d');g.drawImage(MAP,0,0);MD=g.getImageData(0,0,MW,MH).data;})();
const img=x.createImageData(W,H);
function globe(R,lat0,lon0){const d=img.data,cx=W/2,cy=H/2,la=lat0*Math.PI/180,sl=Math.sin(la),cla=Math.cos(la);
 d.fill(0);for(let py=0;py<H;py++){const v=(cy-py)/R;if(Math.abs(v)>1)continue;for(let px=0;px<W;px++){const u=(px-cx)/R,q=u*u+v*v;if(q>1)continue;const z=Math.sqrt(1-q);
  const lat=Math.asin(v*cla+z*sl),lon=lon0*Math.PI/180+Math.atan2(u,z*cla-v*sl);
  let mx=((lon/Math.PI+1)/2%1+1)%1*MW|0,my=cl((.5-lat/Math.PI)*MH,0,MH-1)|0,o=(my*MW+mx)*4,p=(py*W+px)*4,sh=.35+.65*Math.pow(z,.5);
  d[p]=MD[o]*sh;d[p+1]=MD[o+1]*sh;d[p+2]=MD[o+2]*sh;d[p+3]=255}}x.putImageData(img,0,0);
 const gr=x.createRadialGradient(W/2,H/2,R*.96,W/2,H/2,R*1.08);gr.addColorStop(0,'rgba(90,160,255,0)');gr.addColorStop(.4,'rgba(110,180,255,.55)');gr.addColorStop(1,'rgba(90,160,255,0)');
 x.globalCompositeOperation='screen';x.fillStyle=gr;x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';}
function plane(px,py,s,rot){x.save();x.translate(px,py);x.rotate(rot);x.scale(s,s);x.fillStyle='#f3ead8';x.strokeStyle='#14110f';x.lineWidth=5;x.lineJoin='round';
 x.beginPath();x.moveTo(-160,0);x.quadraticCurveTo(-150,-18,-120,-20);x.lineTo(150,-16);x.quadraticCurveTo(190,-10,195,4);x.quadraticCurveTo(185,16,150,16);x.lineTo(-120,18);x.quadraticCurveTo(-150,16,-160,0);x.fill();x.stroke();
 x.beginPath();x.moveTo(20,0);x.lineTo(-40,-110);x.lineTo(-10,-110);x.lineTo(70,-4);x.closePath();x.fill();x.stroke();
 x.beginPath();x.moveTo(20,8);x.lineTo(-30,95);x.lineTo(0,95);x.lineTo(70,10);x.closePath();x.fill();x.stroke();
 x.beginPath();x.moveTo(-120,-18);x.lineTo(-160,-80);x.lineTo(-135,-80);x.lineTo(-95,-18);x.fill();x.stroke();
 x.fillStyle='#1c3f8c';x.fillRect(-100,-6,240,7);x.fillStyle='#a3262f';x.fillRect(-100,2,240,5);
 x.fillStyle='#14110f';for(let i=0;i<9;i++){x.beginPath();x.arc(-70+i*24,-6,4,0,7);x.fill()}x.restore();}
function sky(t,dusk){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,dusk?'#1c3f8c':'#3a78d0');g.addColorStop(.6,dusk?'#e8916a':'#9cc8f0');g.addColorStop(1,dusk?'#f3c48a':'#e8f2fb');x.fillStyle=g;x.fillRect(0,0,W,H);}
function cloudLayer(t,sp,alpha,y0,yr,sz){x.fillStyle=`rgba(255,255,255,${alpha})`;for(const [a,b,s] of clouds){const cx=((a-t*sp*s)%1.6+1.6)%1.6*W-200,cy=y0+b*yr,r=sz*s;
 x.beginPath();x.arc(cx,cy,r,0,7);x.arc(cx+r*.9,cy+r*.2,r*.8,0,7);x.arc(cx-r*.9,cy+r*.25,r*.7,0,7);x.fill()}}
function city(t){x.fillStyle='#2b2140';const b=1270;x.beginPath();x.moveTo(0,b);let px=0;const hs=[60,120,80,150,90,200,70,110,140,60,100,170,80,120];for(let i=0;px<W;i++){const h=hs[i%hs.length],w=50+(i*37%60);x.lineTo(px,b-h);x.lineTo(px+w,b-h);px+=w}x.lineTo(W,b);x.fill();
 x.fillRect(820,b-430,14,330);x.beginPath();x.moveTo(800,b-300);x.lineTo(854,b-300);x.lineTo(845,b-250);x.lineTo(809,b-250);x.fill();x.fillRect(826,b-500,3,80);// Avala tower
 x.fillStyle='#3d4a2e';x.fillRect(0,b,W,H-b);x.fillStyle='#4a4a52';x.beginPath();x.moveTo(470,b);x.lineTo(610,b);x.lineTo(W+250,H);x.lineTo(-250,H);x.fill();x.fillStyle='#f3ead8';
 for(let i=0;i<10;i++){const k=((i/10+t*.9)%1),y=b+Math.pow(k,2.2)*(H-b),w=4+30*Math.pow(k,2.2),h=10+120*Math.pow(k,2.2);x.fillRect(540-w/2,y,w,h)}
 x.fillStyle='#e8b13a';for(let i=0;i<14;i++){const k=Math.pow(((i/14+t*.9)%1),2.2),y=b+k*(H-b),dx=170+k*950;x.beginPath();x.arc(540-dx,y,3+12*k,0,7);x.arc(540+dx,y,3+12*k,0,7);x.fill()}}
function grain(){x.globalAlpha=.06;for(let i=0;i<1400;i++){x.fillStyle=Math.random()<.5?'#000':'#fff';x.fillRect(Math.random()*W,Math.random()*H,2,2)}x.globalAlpha=1;
 const v=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,W,H)}
function cover(im,z,fx,fy,dx=0,dy=0){const k=Math.max(W/im.width,H/im.height)*z,w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)*fx+dx,(H-h)*fy+dy,w,h)}
const $=id=>document.getElementById(id);
window.seek=t=>{x.setTransform(1,0,0,1,0,0);
 $('t').style.opacity=cl((t-.6)/.5)*cl((3.6-t)/.5);
 $('sign').style.display=$('bub').style.display='none';0&&cl((t-10.2)/.3)*cl((12.1-t)/.3);$('sign').style.transform=`translateX(-50%) scale(${1+.04*(t-10)})`;
 const bt=cl((t-12.3)/.35);$('bub').style.opacity=bt;$('bub').style.transform=`scale(${.6+.4*ease(bt)+.01*Math.sin(t*3)})`;
 if(t<6){x.fillStyle='#02030a';x.fillRect(0,0,W,H);for(const [a,b,s,ph] of stars){x.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+ph*9));x.fillStyle='#fff';x.fillRect(a,b,s,s)}x.globalAlpha=1;
  const p=ease(cl(t/5.6)),R=260*Math.pow(9000/260,Math.pow(cl(t/5.6),1.6));globe(R,mix(15,44.8,p),mix(-15,20.5,p));
  if(t>4.6){const a=cl((t-4.6)/1.1);sky(t,0);x.globalAlpha=a;cloudLayer(t,.05,.95,0,H,260);x.globalAlpha=1}
 } if(t>=5.7&&t<10.4){const p=cl((t-5.7)/4.7);cover(P1,1.14-.1*ease(p),.62-.3*p,.5,0,Math.sin(t*2)*6);
   if(t<6.1){x.fillStyle=`rgba(255,255,255,${1-cl((t-5.7)/.4)})`;x.fillRect(0,0,W,H)}
   if(t>9.8){x.fillStyle=`rgba(255,255,255,${cl((t-9.8)/.6)})`;x.fillRect(0,0,W,H)}}
 if(t>=10.4&&t<12.5){const p=cl((t-10.4)/2.1),sh=t>11.75&&t<12.1?Math.sin(t*90)*8*(12.1-t)/.35:0;cover(P2,1.0+.14*ease(p),.5,.6,0,sh);
   if(t<10.7){x.fillStyle=`rgba(255,255,255,${1-cl((t-10.4)/.3)})`;x.fillRect(0,0,W,H)}}
 if(t>=12.2){const p=cl((t-12.2)/3.8);cover(P3,1.0+.07*p,.5,.05+.12*p);
   if(t<12.5){x.fillStyle=`rgba(255,255,255,${1-cl((t-12.2)/.3)})`;x.fillRect(0,0,W,H)}}
 grain();};
</script></body></html>
